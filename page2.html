<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accès secondaire</title>

<style>
body {
  background-color: #0d0d0d;
  color: #00ffcc;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  text-align: center;
  background-color: #111;
  padding: 30px;
  border-radius: 10px;
}

input {
  padding: 10px;
  margin: 10px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 5px;
  background-color: #00ffcc;
  cursor: pointer;
}
</style>

</head>
<body>

<div class="container">
  <h2>Entrer le code final</h2>

  <input type="text" id="code" placeholder="Code"><br>

  <button onclick="checkCode()">Valider</button><br><br>

  <!-- 🔒 Bouton caché au début -->
  <button id="nextBtn" onclick="goNext()" style="display:none;">Page suivante</button><br><br>

  <button onclick="goBack()">Retour</button>

  <p id="result"></p>
</div>

<script>

function checkCode() {
  let code = document.getElementById("code").value;

  if (code === "CACAPROUT") {
    document.getElementById("result").innerHTML = "Accès autorisé...";

    // 🔓 Affiche le bouton seulement si code correct
    document.getElementById("nextBtn").style.display = "inline-block";

  } else {
    document.getElementById("result").innerHTML = "Code incorrect.";
  }
}

function goNext() {
  window.location.href = "page3.html";
}

function goBack() {
  window.location.href = "index.html";
}

</script>

</body>
</html>
