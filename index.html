<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>kcul_doog</title>

<style>
body {
  background-color: #0d0d0d;
  color: #00ffcc;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  text-align: center;
  background-color: #111;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 20px #00ffcc33;
}

input {
  padding: 10px;
  margin: 10px;
  border-radius: 5px;
  border: none;
  width: 200px;
}

button {
  padding: 10px 20px;
  margin-top: 10px;
  border: none;
  border-radius: 5px;
  background-color: #00ffcc;
  color: black;
  cursor: pointer;
}

button:hover {
  background-color: #00ccaa;
}
</style>

</head>
<body>

<div class="container">
  <h2>Connexion</h2>

  <input type="text" id="user" placeholder="Identifiant"><br>

  <input type="password" id="pass" placeholder="Mot de passe">
  <br>

  <button onclick="togglePassword()">Afficher / Masquer</button><br>

  <button onclick="login()">Valider</button>

  <!-- 🔒 Bouton caché au début -->
  <button id="nextBtn" onclick="goNext()" style="display:none;">Page suivante</button>

  <p id="result"></p>
</div>

<script>

// IDENTIFIANTS + MOTS DE PASSE
const data = {
  "naneey_": "mdp1",
  "kolibri8680": "mdp2",
  "herstal": "mdp3",
  "k.g.f": "13AO25",
  "kayu.mp4": "mdp5",
  "lysias_31130": "mdp6",
  "h.e.s.t.i.a": "mdp7",
  "starkeeeey": "mdp8",
  "kussenspookje": "mdp9"
};

// INDICES PERSONNALISÉS
const indices = {
  "naneey_": "Félicitation ! Ton indice est ",
  "kolibri8680": "Félicitation ! Ton indice est ",
  "herstal": "Félicitation ! Ton indice est ",
  "k.g.f": "Félicitation ! Ton indice est ",
  "kayu.mp4": "Félicitation ! Ton indice est ",
  "lysias_31130": "Félicitation ! Ton indice est ",
  "h.e.s.t.i.a": "Félicitation ! Ton indice est ",
  "starkeeeey": "Félicitation ! Ton indice est ",
  "kussenspookje": "Félicitation ! Ton indice est "
};

// AFFICHER / MASQUER MOT DE PASSE
function togglePassword() {
  let passField = document.getElementById("pass");
  if (passField.type === "password") {
    passField.type = "text";
  } else {
    passField.type = "password";
  }
}

// LOGIN
function login() {
  let user = document.getElementById("user").value;
  let pass = document.getElementById("pass").value;

  if (data[user] && data[user] === pass) {
    document.getElementById("result").innerHTML = indices[user];

    // 🔓 Affiche le bouton uniquement si c'est bon
    document.getElementById("nextBtn").style.display = "inline-block";

  } else {
    document.getElementById("result").innerHTML = "Accès refusé.";
  }
}

// CHANGEMENT DE PAGE
function goNext() {
  window.location.href = "page2.html";
}

</script>

</body>
</html>
